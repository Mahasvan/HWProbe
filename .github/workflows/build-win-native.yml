name: Build Windows Native Bindings

on:
  push:
    branches: [ main ]
    paths:
      - 'src/hwprobe/interops/win/**'
      - '.github/workflows/build-win-native.yml'
  pull_request:
    paths:
      - 'src/hwprobe/interops/win/**'
      - '.github/workflows/build-win-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          cmake -S src/hwprobe/interops/win -B build-win \
            -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build-win

      - name: Verify artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for dll in src/hwprobe/interops/win/bindings/*.dll; do
            echo "--- $dll ---"
            file "$dll"
            objdump -p "$dll" | grep "DLL Name" || true
          done

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-bindings
          path: src/hwprobe/interops/win/bindings/*.dll

      - name: Commit updated binaries
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hwprobe/interops/win/bindings/*.dll
          if git diff --cached --quiet; then
            echo "No binary changes to commit"
          else
            git commit -m "build: update Windows native bindings [skip ci]"
            git pull --rebase
            git push
          fi
